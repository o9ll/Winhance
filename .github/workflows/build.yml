name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        id: build
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yy.MM.dd'
          $unique = "$date-$(Get-Date -Format 'HHmmss')"
          "tag=v$unique" >> $env:GITHUB_OUTPUT
          "title=Winhance v$unique" >> $env:GITHUB_OUTPUT
          & "$env:GITHUB_WORKSPACE/extras/build-and-package.ps1" -Version $date -NoSign -SkipTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.build.outputs.tag }}" `
            --title "${{ steps.build.outputs.title }}" `
            "installer-output/Winhance.Installer.exe"
