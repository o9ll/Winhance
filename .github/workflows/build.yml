name: Build and Release

on:
  workflow_dispatch:
    inputs:
      beta:
        description: Create a beta prerelease
        type: boolean
        default: false
      skip_tests:
        description: Skip test suite
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Resolve version and tag
        id: version
        env:
          IS_BETA: ${{ github.event_name == 'workflow_dispatch' && inputs.beta || false }}
        shell: pwsh
        run: |
          $version = Get-Date -Format 'yy.MM.dd'
          $beta = $env:IS_BETA -eq 'true'
          if ($beta) {
            "display=$version-beta" >> $env:GITHUB_OUTPUT
            "tag=v$version-beta" >> $env:GITHUB_OUTPUT
            "installer=Winhance.Installer.Beta.exe" >> $env:GITHUB_OUTPUT
            "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            "display=$version" >> $env:GITHUB_OUTPUT
            "tag=v$version" >> $env:GITHUB_OUTPUT
            "installer=Winhance.Installer.exe" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check for existing release tag
        id: tag_check
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = '${{ steps.version.outputs.tag }}'
          if (git rev-parse "refs/tags/$tag" 2>$null) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tag already exists."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tag is available."
          }

      - name: Build and package
        env:
          SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests || false }}
        shell: pwsh
        run: |
          $params = @{
            Version = '${{ steps.version.outputs.version }}'
            NoSign  = $true
          }
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $params.Beta = $true }
          if ($env:SKIP_TESTS -eq 'true') { $params.SkipTests = $true }
          & "$env:GITHUB_WORKSPACE/extras/build-and-package.ps1" @params

      - name: Create Git tag
        if: steps.tag_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Winhance v${{ steps.version.outputs.display }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub release
        if: steps.tag_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Winhance v${{ steps.version.outputs.display }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: installer-output/${{ steps.version.outputs.installer }}

      - name: Skip release (tag already exists)
        if: steps.tag_check.outputs.exists == 'true'
        shell: pwsh
        run: |
          Write-Host "Release skipped: tag '${{ steps.version.outputs.tag }}' already exists."
          Write-Host "Build succeeded. Run workflow_dispatch with a new date or delete the existing tag to publish again."
